<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EF" />
      <stop offset="25%" stop-color="#E8D5A3" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8C6828" />
    </linearGradient>
  </defs>
  <g transform="translate(250, 250)">
    <!-- Concentric decorative rings -->
    <circle r="240" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.6" />
    <circle r="230" fill="none" stroke="url(#mandalaGold)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.8" />
    <circle r="215" fill="none" stroke="url(#mandalaGold)" stroke-width="2" opacity="0.5" />
    <circle r="180" fill="none" stroke="url(#mandalaGold)" stroke-width="1" opacity="0.6" />
    <circle r="140" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.7" />
    <circle r="95" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.8" />
    <circle r="50" fill="none" stroke="url(#mandalaGold)" stroke-width="2" opacity="0.9" />
    <circle r="18" fill="url(#mandalaGold)" opacity="0.85" />

    <!-- 16 Outer Royal Petals / Leaves -->
