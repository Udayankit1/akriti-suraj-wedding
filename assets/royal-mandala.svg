      <g transform="rotate(22.5)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(45)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(67.5)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(90)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(112.5)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(135)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
