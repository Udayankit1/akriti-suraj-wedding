      <g transform="rotate(180)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(202.5)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(225)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(247.5)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(270)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(292.5)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(315)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
      <g transform="rotate(337.5)"><path d="M0 -215 C-15 -180 -25 -140 0 -95 C25 -140 15 -180 0 -215 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.2" opacity="0.75" /><path d="M0 -215 L0 -95" stroke="url(#mandalaGold)" stroke-width="0.6" opacity="0.4" /><circle cx="0" cy="-215" r="3.5" fill="url(#mandalaGold)" opacity="0.9" /></g>
    </g>

    <!-- Inner 8 Lotus Petals -->
    <g id="innerLotus">
      <path d="M0 -95 C-20 -70 -20 -30 0 -18 C20 -30 20 -70 0 -95 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.9" />
