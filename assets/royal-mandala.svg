      <g transform="rotate(90)"><path d="M0 -95 C-20 -70 -20 -30 0 -18 C20 -30 20 -70 0 -95 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.9" /></g>
      <g transform="rotate(135)"><path d="M0 -95 C-20 -70 -20 -30 0 -18 C20 -30 20 -70 0 -95 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.9" /></g>
      <g transform="rotate(180)"><path d="M0 -95 C-20 -70 -20 -30 0 -18 C20 -30 20 -70 0 -95 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.9" /></g>
      <g transform="rotate(225)"><path d="M0 -95 C-20 -70 -20 -30 0 -18 C20 -30 20 -70 0 -95 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.9" /></g>
      <g transform="rotate(270)"><path d="M0 -95 C-20 -70 -20 -30 0 -18 C20 -30 20 -70 0 -95 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.9" /></g>
      <g transform="rotate(315)"><path d="M0 -95 C-20 -70 -20 -30 0 -18 C20 -30 20 -70 0 -95 Z" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" opacity="0.9" /></g>
