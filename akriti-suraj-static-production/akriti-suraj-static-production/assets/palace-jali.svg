<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="jaliGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Outer diamond frame -->
      <path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="#C6A15B" stroke-width="1" opacity="0.4" />
      <path d="M30 5 L55 30 L30 55 L5 30 Z" fill="none" stroke="#C6A15B" stroke-width="0.6" opacity="0.25" />
      
      <!-- Central 8-pointed star rosette -->
      <polygon points="30,16 33,26 44,26 35,32 39,42 30,36 21,42 25,32 16,26 27,26" fill="none" stroke="#C6A15B" stroke-width="0.8" opacity="0.45" />
      
      <!-- Corner intersecting arcs (Mughal Jali Trefoil) -->
      <path d="M0,0 Q15,0 15,15 Q0,15 0,0" fill="none" stroke="#C6A15B" stroke-width="0.7" opacity="0.3" />
      <path d="M60,0 Q45,0 45,15 Q60,15 60,0" fill="none" stroke="#C6A15B" stroke-width="0.7" opacity="0.3" />
      <path d="M0,60 Q15,60 15,45 Q0,45 0,60" fill="none" stroke="#C6A15B" stroke-width="0.7" opacity="0.3" />
      <path d="M60,60 Q45,60 45,45 Q60,45 60,60" fill="none" stroke="#C6A15B" stroke-width="0.7" opacity="0.3" />
      
      <!-- Tiny center ring -->
      <circle cx="30" cy="30" r="2.5" fill="none" stroke="#E8D5A3" stroke-width="0.8" opacity="0.5" />
      <!-- Corner dots -->
      <circle cx="0" cy="0" r="1.5" fill="#C6A15B" opacity="0.3" />
      <circle cx="60" cy="0" r="1.5" fill="#C6A15B" opacity="0.3" />
      <circle cx="0" cy="60" r="1.5" fill="#C6A15B" opacity="0.3" />
      <circle cx="60" cy="60" r="1.5" fill="#C6A15B" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#jaliGrid)" />
</svg>
